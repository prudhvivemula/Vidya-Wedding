<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A collection of wedding memories.">
  <title>Our Wedding Story</title>
  <style>
    :root {
      --ink: #2d2925;
      --cream: #f7f3ed;
      --rose: #a8756a;
      --white: #fffdf9;
      --muted: #756c64;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }
    .hero {
      min-height: 48vh;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        linear-gradient(rgba(45, 41, 37, .22), rgba(45, 41, 37, .55)),
        linear-gradient(125deg, #a68470, #d5bba0 48%, #826f63);
      background-position: center;
      background-size: cover;
      color: white;
    }
    .hero-inner { padding: 48px 20px; }
    .eyebrow {
      margin: 0 0 16px;
      font: 600 12px/1.2 Arial, sans-serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(52px, 9vw, 100px);
      font-weight: 400;
      line-height: .9;
    }
    .ampersand {
      display: block;
      margin: 15px 0 10px;
      color: #eadfcf;
      font-size: .38em;
    }
    .date {
      margin: 24px 0 0;
      font: 500 13px/1.4 Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    main { max-width: 1440px; margin: auto; padding: 44px 26px 72px; }
    .intro { max-width: 720px; margin: 0 auto 30px; text-align: center; }
    .intro h2 {
      margin: 0 0 12px;
      font-size: clamp(32px, 5vw, 52px);
      font-weight: 400;
    }
    .intro p { margin: 0; color: var(--muted); font: 15px/1.8 Arial, sans-serif; }
    .controls { display: grid; justify-items: center; gap: 16px; margin-bottom: 28px; }
    .filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
    .filter, .pager button {
      border: 1px solid #d4cabd;
      border-radius: 999px;
      padding: 9px 15px;
      background: transparent;
      color: #62584f;
      cursor: pointer;
      font: 600 11px/1 Arial, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .filter.active, .filter:hover, .pager button:not(:disabled):hover {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }
    .search {
      width: min(100%, 420px);
      border: 1px solid #d4cabd;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--white);
      color: var(--ink);
      font: 14px Arial, sans-serif;
      outline-color: var(--rose);
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      align-items: start;
      gap: 14px;
    }
    .card {
      display: block;
      width: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      overflow: hidden;
      background: #e6dfd4;
      color: inherit;
      cursor: zoom-in;
      text-align: left;
      font: inherit;
      animation: appear .35s ease both;
    }
    .card-image {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      background-repeat: no-repeat;
      transition: transform .6s cubic-bezier(.2,.75,.25,1), filter .3s;
    }
    .card:hover .card-image { transform: scale(1.025); filter: brightness(.92); }
    .card-caption {
      overflow: hidden;
      padding: 10px 12px;
      color: #62584f;
      font: 11px/1.5 Arial, sans-serif;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .pager {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 28px;
      color: var(--muted);
      font: 12px Arial, sans-serif;
    }
    .pager button:disabled { cursor: default; opacity: .45; }
    .status { margin: 0; color: var(--muted); font: 12px Arial, sans-serif; text-align: center; }
    .lightbox {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(28, 25, 22, .94);
    }
    .lightbox.open { display: flex; }
    .lightbox figure { width: min(480px, calc(100vw - 120px)); margin: 0; text-align: center; }
    .lightbox-image {
      width: 100%;
      aspect-ratio: 4 / 5;
      background-repeat: no-repeat;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .lightbox figcaption { margin-top: 10px; color: white; font: 12px Arial, sans-serif; }
    .lb-close, .lb-prev, .lb-next {
      position: absolute;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      font: 300 28px/1 Arial, sans-serif;
    }
    .lb-close { top: 24px; right: 28px; font-size: 36px; }
    .lb-prev { left: 24px; top: 50%; }
    .lb-next { right: 24px; top: 50%; }
    footer {
      padding: 30px 20px;
      text-align: center;
      color: #81776d;
      font: 11px/1.7 Arial, sans-serif;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } }
    @media (max-width: 600px) {
      .hero { min-height: 40vh; }
      main { padding: 34px 12px 54px; }
      .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
      .lightbox figure { width: calc(100vw - 24px); }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
    }
  </style>
</head>
<body>
  <header class="hero" id="hero">
    <div class="hero-inner">
      <p class="eyebrow">The Wedding Album</p>
      <h1>Bride <span class="ampersand">&amp;</span> Groom</h1>
      <p class="date">A celebration of love</p>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>Moments to remember</h2>
      <p>A collection of moments and memories from the celebration.</p>
    </section>
    <section class="controls" aria-label="Gallery controls">
      <nav class="filters" id="filters" aria-label="Photo categories"></nav>
      <input class="search" id="search" type="search" placeholder="Search photo names or folders" aria-label="Search photos">
    </section>
    <p class="status" id="status" role="status">Loading the album…</p>
    <section class="gallery" id="gallery" aria-label="Wedding photo gallery"></section>
    <nav class="pager" aria-label="Gallery pages">
      <button id="previous" type="button" disabled>Previous</button>
      <span id="page-label">Page 1</span>
      <button id="next" type="button" disabled>Next</button>
    </nav>
  </main>

  <footer>Two hearts · one beautiful story</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
    <figure>
      <div class="lightbox-image" id="lb-image" role="img"></div>
      <figcaption id="lb-caption"></figcaption>
    </figure>
    <button class="lb-next" aria-label="Next photo">&#8250;</button>
  </div>

  <script>
    const pageSize = 72;
    const sheetColumns = 20;
    const sheetRows = 10;
    const gallery = document.getElementById("gallery");
    const filters = document.getElementById("filters");
    const search = document.getElementById("search");
    const status = document.getElementById("status");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const pageLabel = document.getElementById("page-label");
    const lightbox = document.getElementById("lightbox");
    const lbImage = document.getElementById("lb-image");
    const lbCaption = document.getElementById("lb-caption");
    let photos = [];
    let visible = [];
    let currentCategory = "all";
    let page = 0;
    let currentPhoto = 0;

    function caption(photo) {
      return `${photo.category} · ${photo.caption}`;
    }

    function setTile(element, photo) {
      const x = photo.column / (sheetColumns - 1) * 100;
      const y = photo.row / (sheetRows - 1) * 100;
      element.style.backgroundImage = `url("${photo.sheet}")`;
      element.style.backgroundSize = `${sheetColumns * 100}% ${sheetRows * 100}%`;
      element.style.backgroundPosition = `${x}% ${y}%`;
    }

    function render() {
      const query = search.value.trim().toLocaleLowerCase();
      visible = photos.filter(photo => {
        const inCategory = currentCategory === "all" || photo.category === currentCategory;
        const matches = !query || `${photo.category} ${photo.caption}`.toLocaleLowerCase().includes(query);
        return inCategory && matches;
      });
      const pageCount = Math.max(1, Math.ceil(visible.length / pageSize));
      page = Math.min(page, pageCount - 1);
      const start = page * pageSize;
      const entries = visible.slice(start, start + pageSize);
      gallery.replaceChildren();
      entries.forEach((photo, index) => {
        const card = document.createElement("button");
        card.className = "card";
        card.type = "button";
        card.setAttribute("aria-label", caption(photo));
        const image = document.createElement("span");
        image.className = "card-image";
        image.setAttribute("aria-hidden", "true");
        setTile(image, photo);
        const label = document.createElement("span");
        label.className = "card-caption";
        label.textContent = caption(photo);
        card.append(image, label);
        card.addEventListener("click", () => openLightbox(start + index));
        gallery.appendChild(card);
      });
      status.textContent = `${visible.length.toLocaleString()} unique photos`;
      pageLabel.textContent = `Page ${page + 1} of ${pageCount}`;
      previous.disabled = page === 0;
      next.disabled = page >= pageCount - 1;
    }

    function openLightbox(index) {
      currentPhoto = index;
      const photo = visible[currentPhoto];
      setTile(lbImage, photo);
      lbImage.setAttribute("aria-label", caption(photo));
      lbCaption.textContent = caption(photo);
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }

    function move(delta) {
      currentPhoto = (currentPhoto + delta + visible.length) % visible.length;
      openLightbox(currentPhoto);
    }

    function setCategory(category, button) {
      currentCategory = category;
      page = 0;
      filters.querySelector(".active")?.classList.remove("active");
      button.classList.add("active");
      render();
    }

    async function start() {
      const response = await fetch("gallery.json");
      if (!response.ok) throw new Error(`Could not load gallery data (${response.status})`);
      const data = await response.json();
      photos = data.photos;
      const categories = [...new Set(photos.map(photo => photo.category))].sort((a, b) => a.localeCompare(b));
      const buttons = [["all", "All Photos"], ...categories.map(category => [category, category])];
      for (const [value, label] of buttons) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `filter${value === "all" ? " active" : ""}`;
        button.textContent = label;
        button.addEventListener("click", () => setCategory(value, button));
        filters.appendChild(button);
      }
      status.textContent = "";
      render();
    }

    search.addEventListener("input", () => { page = 0; render(); });
    previous.addEventListener("click", () => { page--; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    next.addEventListener("click", () => { page++; render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    document.querySelector(".lb-close").addEventListener("click", closeLightbox);
    document.querySelector(".lb-prev").addEventListener("click", () => move(-1));
    document.querySelector(".lb-next").addEventListener("click", () => move(1));
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
    });

    start().catch(error => {
      status.textContent = "The album could not be loaded. Please try again later.";
      console.error(error);
    });
  </script>
</body>
</html>
