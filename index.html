<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Wedding Story</title>
  <style>
    :root {
      --ink: #2d2925;
      --cream: #f7f3ed;
      --rose: #a8756a;
      --gold: #b89c70;
      --white: #fffdf9;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }
    .hero {
      min-height: 72vh;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        linear-gradient(rgba(45, 41, 37, .18), rgba(45, 41, 37, .52)),
        url("full_wedding_06.jpg") center 44% / cover no-repeat;
      color: white;
    }
    .hero-inner { animation: rise 1.2s ease both; }
    .eyebrow {
      margin: 0 0 16px;
      font: 600 12px/1.2 Arial, sans-serif;
      letter-spacing: .34em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(54px, 9vw, 112px);
      font-weight: 400;
      line-height: .9;
    }
    .ampersand {
      display: block;
      margin: 18px 0 10px;
      font-size: .38em;
      color: #eadfcf;
    }
    .date {
      margin: 24px 0 0;
      font: 500 13px/1.4 Arial, sans-serif;
      letter-spacing: .24em;
      text-transform: uppercase;
    }
    main { max-width: 1280px; margin: auto; padding: 48px 28px 80px; }
    .intro {
      max-width: 680px;
      margin: 0 auto 38px;
      text-align: center;
    }
    .intro h2 {
      margin: 0 0 12px;
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 400;
    }
    .intro p {
      margin: 0;
      color: #756c64;
      font: 15px/1.8 Arial, sans-serif;
    }
    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 28px;
    }
    .filter {
      border: 1px solid #d4cabd;
      border-radius: 999px;
      padding: 9px 16px;
      background: transparent;
      color: #62584f;
      cursor: pointer;
      font: 600 11px/1 Arial, sans-serif;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .filter.active, .filter:hover {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }
    .gallery {
      columns: 3 280px;
      column-gap: 16px;
    }
    .card {
      position: relative;
      break-inside: avoid;
      margin: 0 0 16px;
      overflow: hidden;
      background: #e6dfd4;
      cursor: zoom-in;
      animation: appear .55s ease both;
    }
    .card img {
      display: block;
      width: 100%;
      height: auto;
      transition: transform .7s cubic-bezier(.2,.75,.25,1), filter .3s;
    }
    .card:hover img { transform: scale(1.025); filter: brightness(.92); }
    .card-label {
      position: absolute;
      left: 14px;
      bottom: 12px;
      padding: 7px 9px;
      background: rgba(255,255,255,.88);
      color: #51483f;
      opacity: 0;
      transform: translateY(5px);
      transition: .3s;
      font: 600 10px/1 Arial, sans-serif;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .card:hover .card-label { opacity: 1; transform: none; }
    .lightbox {
      position: fixed;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(28, 25, 22, .94);
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 80px);
      object-fit: contain;
      box-shadow: 0 18px 60px rgba(0,0,0,.35);
    }
    .lb-close, .lb-prev, .lb-next {
      position: absolute;
      border: 0;
      background: transparent;
      color: white;
      cursor: pointer;
      font: 300 28px/1 Arial, sans-serif;
    }
    .lb-close { top: 24px; right: 28px; font-size: 36px; }
    .lb-prev { left: 24px; top: 50%; }
    .lb-next { right: 24px; top: 50%; }
    footer {
      padding: 34px 20px;
      text-align: center;
      color: #81776d;
      font: 11px/1.7 Arial, sans-serif;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } }
    @media (max-width: 700px) {
      .hero { min-height: 62vh; }
      main { padding: 38px 12px 60px; }
      .gallery { columns: 2 140px; column-gap: 8px; }
      .card { margin-bottom: 8px; }
      .lightbox img { max-width: calc(100vw - 24px); max-height: calc(100vh - 90px); }
      .lb-prev { left: 8px; }
      .lb-next { right: 8px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">The Wedding Album</p>
      <h1>Bride <span class="ampersand">&amp;</span> Groom</h1>
      <p class="date">A celebration of love</p>
    </div>
  </header>

  <main>
    <section class="intro">
      <h2>Moments to remember</h2>
      <p>A collection of candid moments and beautiful memories from the celebration.</p>
    </section>

    <nav class="filters" aria-label="Photo categories">
      <button class="filter active" data-filter="all">All Photos</button>
      <button class="filter" data-filter="bride">Bride</button>
      <button class="filter" data-filter="groom">Groom</button>
      <button class="filter" data-filter="wedding">Wedding</button>
    </nav>

    <section class="gallery" id="gallery" aria-label="Wedding photo gallery"></section>
  </main>

  <footer>Two hearts · one beautiful story</footer>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button class="lb-close" aria-label="Close">&times;</button>
    <button class="lb-prev" aria-label="Previous photo">&#8249;</button>
    <img id="lb-image" alt="">
    <button class="lb-next" aria-label="Next photo">&#8250;</button>
  </div>

  <script>
    const photos = [
      "bride_01","bride_02","bride_03","bride_04","bride_05","bride_06",
      "bride_07","bride_08","bride_09","bride_10","bride_11","bride_12",
      "groom_01","groom_02","groom_03","groom_04","groom_05",
      "groom_06","groom_07","groom_08","groom_09","groom_10",
      "wedding_01","wedding_02","wedding_03","wedding_04","wedding_05","wedding_06",
      "wedding_07","wedding_08","wedding_09","wedding_10","wedding_11","wedding_12"
    ];
    const gallery = document.getElementById("gallery");
    const lightbox = document.getElementById("lightbox");
    const lbImage = document.getElementById("lb-image");
    let visible = [];
    let current = 0;

    function category(name) {
      return name.split("_")[0];
    }

    function render(filter = "all") {
      gallery.innerHTML = "";
      visible = photos.filter(name => filter === "all" || category(name) === filter);
      visible.forEach((name, index) => {
        const card = document.createElement("figure");
        card.className = "card";
        card.style.animationDelay = `${Math.min(index * 35, 350)}ms`;
        card.innerHTML = `
          <img src="thumb_${name}.jpg" alt="${category(name)} wedding photo ${index + 1}" loading="lazy">
          <figcaption class="card-label">${category(name)}</figcaption>`;
        card.addEventListener("click", () => openLightbox(index));
        gallery.appendChild(card);
      });
    }

    function openLightbox(index) {
      current = index;
      lbImage.src = `full_${visible[current]}.jpg`;
      lbImage.alt = `${category(visible[current])} wedding photo`;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightbox.classList.remove("open");
      document.body.style.overflow = "";
    }

    function move(delta) {
      current = (current + delta + visible.length) % visible.length;
      openLightbox(current);
    }

    document.querySelectorAll(".filter").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelector(".filter.active").classList.remove("active");
        button.classList.add("active");
        render(button.dataset.filter);
      });
    });
    document.querySelector(".lb-close").addEventListener("click", closeLightbox);
    document.querySelector(".lb-prev").addEventListener("click", () => move(-1));
    document.querySelector(".lb-next").addEventListener("click", () => move(1));
    lightbox.addEventListener("click", event => { if (event.target === lightbox) closeLightbox(); });
    document.addEventListener("keydown", event => {
      if (!lightbox.classList.contains("open")) return;
      if (event.key === "Escape") closeLightbox();
      if (event.key === "ArrowLeft") move(-1);
      if (event.key === "ArrowRight") move(1);
    });

    render();
  </script>
</body>
</html>
